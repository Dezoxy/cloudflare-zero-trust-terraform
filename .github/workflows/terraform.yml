name: terraform

# Credentials are fetched at runtime from Azure Key Vault via GitHub OIDC.
# There are no static GitHub Actions secrets for cloud credentials -- nothing
# to rotate in GitHub, nothing to leak from a fork, and access is revocable in
# one place (the Entra app's federated credential).

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

# Never let two applies touch the same state at once. cancel-in-progress is
# deliberately false: cancelling a running apply is how state gets orphaned.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Azure Key Vault
        uses: ./.github/actions/azure-secrets
        with:
          keyvault-name: ${{ vars.AZURE_KEYVAULT_NAME }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          folder: cloudflare

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate -no-color

      - name: Plan
        env:
          TF_VAR_cloudflare_api_token: ${{ env.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: terraform plan -input=false -no-color

      # Applies only from main, never from a pull request -- a fork PR must not
      # be able to reach production.
      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TF_VAR_cloudflare_api_token: ${{ env.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: terraform apply -auto-approve -input=false -no-color

      # An auto-applying pipeline that fails silently is worse than no pipeline:
      # merges look successful while nothing reconciles, and drift accumulates
      # unnoticed until something breaks.
      - name: Report failure
        if: failure() && github.ref == 'refs/heads/main'
        run: echo "::error::terraform failed on main -- infrastructure has NOT been reconciled."
